<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Chat — Bella Basket Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column}

/* NAV */
.nav{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-left{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:16px}
.nav-icon{width:36px;height:36px;background:linear-gradient(135deg,#e91e8c,#c2185b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.back-btn{color:rgba(255,255,255,.6);text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid rgba(255,255,255,.15);border-radius:8px;transition:.2s}
.back-btn:hover{background:rgba(255,255,255,.08)}

/* CHAT WRAPPER */
.chat-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.chat-box{width:100%;max-width:480px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 120px)}

/* CHAT HEADER */
.chat-header{background:linear-gradient(135deg,#e91e8c,#c2185b);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.avatar{width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.chat-info h3{color:#fff;font-size:15px;font-weight:700}
.chat-info p{color:rgba(255,255,255,.75);font-size:12px}
.online-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}

.msg{display:flex;gap:8px;max-width:85%;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.bot{align-self:flex-start}

.bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:linear-gradient(135deg,#e91e8c,#c2185b);color:#fff;border-bottom-right-radius:4px}
.msg.bot  .bubble{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);border-bottom-left-radius:4px;border:1px solid rgba(255,255,255,.08)}

.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;align-self:flex-end}
.msg.bot  .msg-avatar{background:linear-gradient(135deg,#e91e8c,#c2185b)}
.msg.user .msg-avatar{background:rgba(255,255,255,.15)}

/* TYPING */
.typing-bubble{padding:10px 16px}
.typing-dots{display:flex;gap:5px;align-items:center}
.typing-dots span{width:8px;height:8px;background:rgba(255,255,255,.5);border-radius:50%;animation:bounce .9s infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* INPUT */
.input-area{padding:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;flex-shrink:0}
.input-area textarea{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:10px 16px;color:#fff;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:100px;line-height:1.4;transition:.2s}
.input-area textarea::placeholder{color:rgba(255,255,255,.35)}
.input-area textarea:focus{border-color:#e91e8c;background:rgba(233,30,140,.06)}
.send-btn{width:44px;height:44px;background:linear-gradient(135deg,#e91e8c,#c2185b);border:none;border-radius:50%;cursor:pointer;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;align-self:flex-end}
.send-btn:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(233,30,140,.4)}
.send-btn:disabled{opacity:.4;transform:none}

/* NOTE */
.demo-note{text-align:center;font-size:11px;color:rgba(255,255,255,.25);padding:8px;flex-shrink:0}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <div class="nav-icon">&#x1F916;</div>
    Demo Chat — Bot Test
  </div>
  <a href="/admin" class="back-btn">&#x2190; Dashboard</a>
</nav>

<div class="chat-wrap">
  <div class="chat-box">

    <div class="chat-header">
      <div class="avatar">&#x1F492;</div>
      <div class="chat-info">
        <h3>Bella Basket Bot</h3>
        <p><span class="online-dot"></span>Online — Test Mode</p>
      </div>
    </div>

    <div class="messages" id="messages">
      <!-- Welcome message -->
      <div class="msg bot">
        <div class="msg-avatar">&#x1F916;</div>
        <div class="bubble">আস্সালামু আলাইকুম! আমি Bella Basket-এর Bot।
এখানে আপনি bot-এর সাথে test করতে পারবেন।

যা জিজ্ঞেস করতে পারেন:
• "চুড়ির দাম কত?"
• "কোন রঙ আছে?"
• "অর্ডার করব"
• "ডেলিভারি চার্জ কত?"</div>
      </div>
    </div>

    <div class="demo-note">এটি test mode — Facebook এ connected নয়</div>

    <div class="input-area">
      <textarea id="msgInput" placeholder="এখানে message লিখুন..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">&#x27A4;</button>
    </div>

  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const input      = document.getElementById('msgInput');
const sendBtn    = document.getElementById('sendBtn');

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const av  = role === 'bot' ? '&#x1F916;' : '&#x1F464;';
  div.innerHTML = `
    <div class="msg-avatar">${av}</div>
    <div class="bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">&#x1F916;</div>
    <div class="bubble typing-bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>`;
  messagesEl.appendChild(div); scrollBottom();
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\n/g,'<br>');
}

async function sendMessage() {
  const msg = input.value.trim();
  if (!msg) return;
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage(msg, 'user');
  showTyping();

  try {
    const res = await fetch('/admin/chat/send', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: msg})
    });
    const data = await res.json();
    hideTyping();
    addMessage(data.reply || '...', 'bot');
  } catch(e) {
    hideTyping();
    addMessage('সংযোগ সমস্যা হয়েছে। আবার চেষ্টা করুন।', 'bot');
  }

  sendBtn.disabled = false;
  input.focus();
}

// Enter to send (Shift+Enter = newline)
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Auto resize textarea
input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

scrollBottom();
</script>
</body>
</html>
